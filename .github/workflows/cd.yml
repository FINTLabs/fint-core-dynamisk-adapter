name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: dyna-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:

  # --------------------------------------------------
  # Figure out which environment/org combinations exist
  # --------------------------------------------------
  setup:
    runs-on: ubuntu-latest

    outputs:
      targets: ${{ steps.targets.outputs.targets }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build deployment matrix
        id: targets
        shell: bash
        run: |
          targets=$(
            yq -o=json -I=0 '
              [
                .environments
                | to_entries[]
                | .key as $environment
                | .value as $config
                | ($config.organisations // [])[]
                | {
                    "environment": $environment,
                    "org": .,
                    "cluster": $config.cluster,
                    "resourceGroup": $config.resourceGroup,
                    "azureSecret": $config.azureSecret,
                    "overlay": ("kustomize/overlays/" + .)
                  }
              ]
            ' kustomize/deployments.yaml
          )

          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "$targets"


  # --------------------------------------------------
  # Build DynA once
  # --------------------------------------------------
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build application
        run: ./gradlew :core-api:bootJar

      - name: Set image
        id: image
        run: |
          echo "image=ghcr.io/fintlabs/fint-core-dynamisk-adapter-backend:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}


  # --------------------------------------------------
  # Run this once for every target from deployments.yaml
  # --------------------------------------------------
  deploy:
    needs:
      - setup
      - build

    if: needs.setup.outputs.targets != '[]'

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.setup.outputs.targets) }}

    environment: ${{ matrix.target.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets[matrix.target.azureSecret] }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: ${{ matrix.target.cluster }}
          resource-group: ${{ matrix.target.resourceGroup }}
          admin: "true"

      - name: Bake manifests
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: kustomize
          kustomizationPath: ${{ matrix.target.overlay }}

      - name: Substitute image into baked YAML
        id: substitute
        uses: azure/k8s-artifact-substitute@v2.0.0
        with:
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: ${{ needs.build.outputs.image }}

      - name: Prepare manifests for deployment
        id: deploy-manifests
        shell: bash
        env:
          SOURCE_DIRECTORY: ${{ steps.substitute.outputs.directory }}
        run: |
          set -euo pipefail

          destination="$GITHUB_WORKSPACE/.k8s-deploy-manifests"
          mkdir -p "$destination"
          cp -aL -- "$SOURCE_DIRECTORY/." "$destination/"

          echo "manifests=$destination" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: azure/k8s-deploy@v7.0.0
        with:
          action: deploy
          manifests: ${{ steps.deploy-manifests.outputs.manifests }}
          pull-images: false

