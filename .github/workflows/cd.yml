name: CD

on:
  push:
    branches:
      - main

concurrency:
  group: dyna-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image: ${{ steps.image.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build application
        run: ./gradlew :core-api:bootJar

      - name: Set image
        id: image
        run: |
          echo "image=ghcr.io/fintlabs/fint-core-dyna:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

  deploy-beta:
    needs: build
    runs-on: ubuntu-latest
    environment: beta

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AKS_BETA_FINT_GITHUB }}

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: aks-beta-fint-2021-11-23
          resource-group: rg-aks-beta
          admin: "true"

      - name: Set 1Password item path
        env:
          ONEPASSWORD_ITEM_PATH: ${{ vars.DYNA_ONEPASSWORD_ITEM_PATH }}
        run: |
          sed -i "s|DYNA_ONEPASSWORD_ITEM_PATH|${ONEPASSWORD_ITEM_PATH}|g" kustomize/base/dyna.yaml

      - name: Bake manifests
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/base

      - name: Deploy
        uses: azure/k8s-deploy@v6
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: |
            ${{ needs.build.outputs.image }}
          namespace: fint-core-dyna

  deploy-alpha:
    needs:
      - build
      - deploy-beta
    runs-on: ubuntu-latest
    environment: alpha

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Azure login
        uses: azure/login@v3
        with:
          creds: ${{ secrets.AKS_ALPHA_FINT_GITHUB }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: "v0.0.26"

      - name: Set AKS context
        uses: azure/aks-set-context@v5
        with:
          cluster-name: YOUR_ALPHA_CLUSTER
          resource-group: rg-aks-alpha
          admin: "true"
          use-kubelogin: 'true'

      - name: Set 1Password item path
        env:
          ONEPASSWORD_ITEM_PATH: ${{ vars.DYNA_ONEPASSWORD_ITEM_PATH }}
        run: |
          sed -i "s|DYNA_ONEPASSWORD_ITEM_PATH|${ONEPASSWORD_ITEM_PATH}|g" kustomize/base/dyna.yaml

      - name: Bake manifests
        id: bake
        uses: azure/k8s-bake@v4
        with:
          renderEngine: kustomize
          kustomizationPath: kustomize/base

      - name: Deploy
        uses: azure/k8s-deploy@v6
        with:
          action: deploy
          manifests: ${{ steps.bake.outputs.manifestsBundle }}
          images: |
            ${{ needs.build.outputs.image }}
          namespace: fint-core-dyna