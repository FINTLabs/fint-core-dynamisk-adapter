dyna:
  engine:
    seed: "novari-beta"
    max-generated-resources: 10000

  runtime:
    startup-domains: [ "utdanning" ]
    enable-delta-sync: true
    reset-every-night: true
    amount-tier-policy:
      grouping:
        min: 1
        max: 2
      core: 10
      dependant:
        min: 20
        max: 30
      unknown:
        min: 1
        max: 2
    delta-config:
      delta-sync-interval-in-minutes: 10
    fint-properties:
      max-page-size: 1000
      heartbeat-interval-in-minutes: 3
      event-check-interval-in-minutes: 0

fint:
  adapter:
    offline-mode: true

logging:
  level:
    no.fintlabs:
      api: INFO
      engine: DEBUG
      adapter: INFO
      runtime: TRACE
